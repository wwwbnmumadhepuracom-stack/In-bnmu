<!-- ========================= dashboard.html ========================= -->

<!DOCTYPE html>
<html>
<head>
<title>Dashboard</title>

<style>

body{
background:#eef3ff;
font-family:Arial;
margin:0;
}

.top{
background:#002147;
color:white;
padding:20px;
text-align:center;
font-size:30px;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
gap:25px;
padding:40px;
max-width:1200px;
margin:auto;
}

.card{
background:white;
padding:30px;
border-radius:20px;
text-align:center;
}

.card img{
width:100px;
height:100px;
border-radius:15px;
}

button{
padding:12px 18px;
background:#002147;
color:white;
border:none;
border-radius:10px;
margin-top:15px;
}

</style>
</head>

<body>

<div class="top">
BNMU Student Dashboard
</div>

<div class="cards">

<div class="card">
<img src="s.jpg">
<h2>Admission Notice</h2>
<button onclick="window.location='admission.html'">
Open
</button>
</div>

<div class="card">
<img src="kk.jpg">
<h2>Your Marksheet</h2>
<button onclick="window.location='marksheet.html'">
Open
</button>
</div>

<div class="card">
<img src="ss.jpg">
<h2>Semester</h2>
<button onclick="window.location='semester.html'">
Open
</button>
</div>

<div class="card">
<img src="pp.jpg">
<h2>Your College</h2>
<button onclick="window.location='college.html'">
Open
</button>
</div>

</div>

</body>
</html>
